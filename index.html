            // Video Player Modal State
            const [videoModal, setVideoModal] = useState({ open: false, title: '' });

            // Form Data & Toast Feedback
            const [formData, setFormData] = useState({
                name: '',
                company: '',
                email: '',
                phone: '',
                category: 'Makeup & Beauty',
                date: '',
                duration: '3 Hours',
                budget: '2000',
                details: ''

                localStorage.setItem('rita_portfolio_photos', JSON.stringify(photos));
            }, [photos]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }

                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
            };

            const openLightbox = (imagesList, startIndex = 0, title = 'Gallery Preview') => {
                setLightbox({ open: true, images: imagesList, index: startIndex, title });
            };

            const nextLightbox = () => {
                setLightbox(prev => ({ ...prev, index: (prev.index + 1) % prev.images.length }));
            };

            const prevLightbox = () => {
                setLightbox(prev => ({ ...prev, index: (prev.index - 1 + prev.images.length) % prev.images.length }));
            };

            // Booking Form Handler
            const handleFormSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.email || !formData.phone) {
                    showToast('Please fill in all required fields.', 'error');
                    return;
                }

                // Construct formatted WhatsApp message
                const text = `Hello Rita,%0A%0AI would like to submit a modelling enquiry:%0A` +
                    `- *Client Name*: ${encodeURIComponent(formData.name)}%0A` +
                    `- *Company/Brand*: ${encodeURIComponent(formData.company || 'N/A')}%0A` +
                    `- *Modelling Type*: ${encodeURIComponent(formData.category)}%0A` +
                    `- *Preferred Date*: ${encodeURIComponent(formData.date || 'To be discussed')}%0A` +
                    `- *Duration*: ${encodeURIComponent(formData.duration)}%0A` +
                    `- *Budget*: EGP ${encodeURIComponent(formData.budget)}%0A` +
                    `- *Phone*: ${encodeURIComponent(formData.phone)}%0A` +
                    `- *Details*: ${encodeURIComponent(formData.details || 'None provided')}`;

                const whatsappUrl = `https://wa.me/201060542538?text=${text}`;
                
                showToast('Booking enquiry generated! Redirecting to WhatsApp...', 'success');
                setTimeout(() => {
                    window.open(whatsappUrl, '_blank');
                }, 1200);
            };
